[project]
name = "codebot"
version = "0.1.0"
description = "CLI tool to work on tasks using AI agents like Claude Code CLI"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "click>=8.1.7",
    "python-dotenv>=1.0.0",
    "flask>=3.0.0",
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0",
]

[project.scripts]
codebot = "codebot.cli:main"

[[tool.uv.index]]
name = "YelpPyPI"
url = "http://169.254.255.254:20641/simple/"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
